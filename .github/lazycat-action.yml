version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: bookstack
build:
  toolchains: []
  run_buildscript: false
images:
  - id: bookstack
    target: service
    service: bookstack
    source: linuxserver/bookstack
    channel: stable
    sort: semver
    tag_regex: ^\d{2}\.\d{2}\.\d+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: BookStack
    skip_if_version_exists: true
